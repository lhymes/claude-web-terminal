name: CI

on:
  push:
    branches: [main, ttyd-mobile]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          ignore_paths: .claude

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "*.md"
          config: |
            {
              "MD013": false,
              "MD033": false,
              "MD041": false
            }

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          # Basic structural check - ensure index.html is well-formed
          grep -q '<!DOCTYPE html>' html/index.html
          grep -q '</html>' html/index.html
          echo "HTML structure OK"

      - name: Check no secrets
        run: |
          # Ensure no API keys or tokens are committed
          ! grep -rE '(api[_-]?key|secret|password|token)\s*[:=]\s*["\x27][^"\x27]{8,}' \
            --include='*.sh' --include='*.html' --include='*.js' . \
            || { echo "Possible secret found"; exit 1; }
          echo "No secrets found"
