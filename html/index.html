<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Claude Terminal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude">
<meta name="theme-color" content="#1e1e1e">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #1e1e1e; overflow: hidden;
    position: fixed; width: 100%;
  }

  #container {
    display: flex; flex-direction: column;
    height: 100%; width: 100%;
    overflow: hidden;
  }

  #terminal {
    flex: 1; min-height: 0; width: 100%;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  /* Hidden input to suppress native keyboard */
  .kb-input {
    position: fixed; left: -9999px; top: 0;
    opacity: 0; width: 1px; height: 1px;
    font-size: 16px;
  }

  /* ---- Shortcut bar (always visible on mobile) ---- */
  #shortcut-bar {
    flex: none;
    display: flex; flex-wrap: nowrap;
    padding: 2px 3px; gap: 3px;
    background: #252526; border-top: 1px solid #3c3c3c;
  }
  #shortcut-bar button {
    flex: 1 1 0; min-width: 32px; height: 34px;
    background: #333; border: 1px solid #555; border-radius: 5px;
    color: #d4d4d4; font-size: 12px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    white-space: nowrap; padding: 0 2px;
    -webkit-tap-highlight-color: transparent;
  }
  #shortcut-bar button:active { background: #569cd6; color: #1e1e1e; }
  #shortcut-bar button.accent { background: #264f78; border-color: #569cd6; }
  #shortcut-bar button.active { background: #569cd6; color: #1e1e1e; }
  #shortcut-bar button.dim { opacity: 0.6; font-size: 10px; }

  /* ---- Custom keyboard ---- */
  #custom-kb {
    flex: none;
    background: #2c2c2e;
    padding: 3px 2px;
    display: none;
    -webkit-user-select: none; user-select: none;
  }
  #custom-kb.visible { display: block; }

  .kb-row {
    display: flex; justify-content: center;
    gap: 3px; margin-bottom: 3px;
    padding: 0 1px;
  }
  .kb-row:last-child { margin-bottom: 0; }

  .kb-key {
    height: 36px; min-width: 28px; flex: 1 1 0;
    border: none; border-radius: 5px;
    background: #636366; color: #fff;
    font-family: -apple-system, system-ui, monospace;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer; padding: 0;
    position: relative;
  }
  .kb-key:active { background: #8e8e93; }
  .kb-key.dark { background: #48484a; font-size: 13px; }
  .kb-key.wide { flex: 1.4; }
  .kb-key.space { flex: 4; }
  .kb-key.active { background: #569cd6; color: #1e1e1e; }

  .kb-num-row .kb-key { height: 28px; font-size: 14px; }

  /* Long-press hint */
  .kb-key .lp-hint {
    position: absolute; top: 2px; right: 3px;
    font-size: 8px; color: #999; pointer-events: none;
  }

  /* Long-press popup */
  .kb-popup {
    display: none; position: absolute;
    bottom: 100%; left: 50%; transform: translateX(-50%);
    background: #569cd6; color: #1e1e1e;
    font-size: 20px; font-weight: bold;
    padding: 4px 12px; border-radius: 6px;
    white-space: nowrap; z-index: 100;
    pointer-events: none;
  }
  .kb-popup.show { display: block; }

  /* Scroll control — joined pill, right edge */
  #scroll-btns {
    position: fixed; right: 8px; z-index: 9999;
    pointer-events: none;
  }
  .scroll-pill {
    width: 44px; height: 110px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 8px 0;
    pointer-events: auto;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .scroll-pill::after {
    content: '';
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 1px;
    background: rgba(255,255,255,0.2);
  }
  .scroll-arrow {
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    pointer-events: none;
    line-height: 1;
  }

  /* ---- Tab bar (tmux window switching) ---- */
  #tab-bar {
    flex: none;
    display: flex; flex-wrap: nowrap;
    padding: 2px 3px; gap: 2px;
    background: #1e1e1e; border-bottom: 1px solid #3c3c3c;
  }
  #tab-bar button {
    flex: 1 1 0; height: 28px;
    background: #2d2d2d; border: none; border-radius: 4px;
    color: #d4d4d4; font-size: 13px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #tab-bar button:active, #tab-bar button.active {
    background: #569cd6; color: #1e1e1e; font-weight: bold;
  }
  #tab-bar button.accent {
    background: #264f78; color: #569cd6; font-weight: bold;
  }

  /* ---- Desktop floating toolbar ---- */
  #desktop-toolbar {
    display: none;
    position: fixed;
    bottom: 4px; right: 30px;
    z-index: 9999;
    background: rgba(37, 37, 38, 0.92);
    border: 1px solid #3c3c3c;
    border-radius: 6px;
    padding: 3px 4px;
    gap: 3px;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #desktop-toolbar button {
    height: 26px; min-width: 28px;
    background: #333; border: 1px solid #555; border-radius: 4px;
    color: #d4d4d4; font-size: 12px; font-family: monospace;
    cursor: pointer; padding: 0 8px;
    white-space: nowrap;
  }
  #desktop-toolbar button:hover { background: #444; border-color: #666; }
  #desktop-toolbar button:active { background: #569cd6; color: #1e1e1e; }
  #desktop-toolbar button.accent {
    background: #264f78; border-color: #569cd6; color: #569cd6;
  }
  #desktop-toolbar button.accent:hover { background: #2d5f8a; }
  #desktop-toolbar .dtab { min-width: 24px; padding: 0 5px; }
  #desktop-toolbar .dtab.active { background: #569cd6; color: #1e1e1e; border-color: #569cd6; }

  @media (max-width: 768px) {
    #terminal, #terminal * { touch-action: none; }
    #desktop-toolbar { display: none !important; }
  }

  @media (min-width: 769px) {
    #tab-bar { display: none; }
    #shortcut-bar { display: none; }
    #custom-kb { display: none !important; }
    .kb-input { display: none; }
    #scroll-btns { display: none; }
    #desktop-toolbar { display: flex; }
  }
</style>
</head>
<body>
<div id="container">
  <div id="tab-bar">
    <button data-tab="1" id="tab1-btn">1</button>
    <button data-tab="2">2</button>
    <button data-tab="3">3</button>
    <button data-tab="4">4</button>
    <button data-tab="5">5</button>
    <button data-tab="6">6</button>
    <button data-tab="7">7</button>
    <button data-tab="8">8</button>
    <button data-tab="9">9</button>
  </div>
  <div id="terminal"></div>
  <input id="nokb" class="kb-input" inputmode="none"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <input id="withkb" class="kb-input" inputmode="text"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    enterkeyhint="send">

  <!-- Shortcut bar: terminal special keys -->
  <div id="shortcut-bar">
    <button data-action="escape">Esc</button>
    <button data-action="tab">Tab</button>
    <button data-action="enter">&crarr;</button>
    <button data-action="left">&larr;</button>
    <button data-action="right">&rarr;</button>
    <button data-action="interrupt" class="dim">^C</button>
    <button data-action="eof" class="dim">^D</button>
    <button id="ctrl-toggle">Ctrl</button>
    <button id="kb-show" class="accent">ABC</button>
  </div>

  <!-- Custom QWERTY keyboard -->
  <div id="custom-kb"></div>
</div>

<div id="desktop-toolbar">
  <button id="dt-new-session" class="accent">+ New</button>
  <span style="width:1px;height:18px;background:#555;margin:0 2px;"></span>
  <button id="dt-mouse-toggle" title="Toggle between scroll wheel and text selection">Scroll</button>
  <span style="width:1px;height:18px;background:#555;margin:0 2px;"></span>
  <button class="dtab" data-dtab="1">1</button>
  <button class="dtab" data-dtab="2">2</button>
  <button class="dtab" data-dtab="3">3</button>
  <button class="dtab" data-dtab="4">4</button>
  <button class="dtab" data-dtab="5">5</button>
  <button class="dtab" data-dtab="6">6</button>
  <button class="dtab" data-dtab="7">7</button>
  <button class="dtab" data-dtab="8">8</button>
  <button class="dtab" data-dtab="9">9</button>
</div>

<div id="scroll-btns">
  <div class="scroll-pill" id="scroll-pill">
    <span class="scroll-arrow">&#9650;</span>
    <span class="scroll-arrow">&#9660;</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(function() {
  // ---- Terminal Actions (shortcut bar) ----
  var ACTIONS = {
    'escape':  '\x1b', 'interrupt': '\x03', 'eof': '\x04',
    'tab':     '\x09', 'enter':     '\r',   'clear': '\x0c',
    'up':      '\x1b[A', 'down':  '\x1b[B',
    'left':    '\x1b[D', 'right': '\x1b[C'
  };

  // ---- Responsive Font Size ----
  function getResponsiveFontSize() {
    var w = window.innerWidth;
    if (w <= 360) return 11;
    if (w <= 428) return 12;
    return 14;
  }

  // ---- Terminal Setup ----
  var term = new Terminal({
    fontSize: getResponsiveFontSize(),
    fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
    theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#d4d4d4' },
    cursorBlink: true,
    allowProposedApi: true
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));

  // ---- WebSocket ----
  var ws = null;
  var isMobile = window.innerWidth < 769;
  function sendInput(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send('0' + data);
  }
  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send('1' + JSON.stringify({ columns: term.cols, rows: term.rows }));
  }
  function connect() {
    if (ws) {
      ws.onclose = null; ws.onerror = null;
      if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) ws.close();
      ws = null;
    }
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var sock = new WebSocket(protocol + '//' + location.host + '/ws', ['tty']);
    sock.binaryType = 'arraybuffer';
    sock.onopen = function() {
      ws = sock;
      fitAddon.fit();
      ws.send(JSON.stringify({ AuthToken: '', columns: term.cols, rows: term.rows }));
    };
    sock.onmessage = function(ev) {
      if (typeof ev.data === 'string') {
        var cmd = ev.data[0], body = ev.data.substring(1);
        switch (cmd) {
          case '0': term.write(body); break;
          case '1': document.title = body; break;
        }
      } else {
        var d = new Uint8Array(ev.data), cmd = String.fromCharCode(d[0]), body = d.subarray(1);
        switch (cmd) {
          case '0': term.write(body); break;
          case '1': document.title = new TextDecoder().decode(body); break;
        }
      }
    };
    sock.onclose = function() {
      ws = null;
      term.write('\r\n\x1b[33mConnection closed. Reconnecting...\x1b[0m\r\n');
      setTimeout(connect, 2000);
    };
    sock.onerror = function() { sock.close(); };
  }
  term.onData(function(data) { sendInput(data); });

  // Desktop mouse mode toggle: "Select" mode (default) suppresses mouse
  // tracking so the browser handles text selection and copy/paste natively.
  // "Mouse" mode lets xterm.js handle mouse events for tmux scrolling/clicking.
  var desktopMouseMode = false; // false = Select (suppress), true = Mouse (passthrough)
  if (!isMobile) {
    var mouseTrackParams = { 9:1, 1000:1, 1001:1, 1002:1, 1003:1, 1006:1, 1015:1 };
    term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, function(params) {
      if (desktopMouseMode) return false; // Mouse mode: let xterm.js handle it
      for (var i = 0; i < params.length; i++) {
        if (mouseTrackParams[params[i]]) return true; // Select mode: swallow
      }
      return false;
    });

    var dtMouseBtn = document.getElementById('dt-mouse-toggle');
    dtMouseBtn.addEventListener('click', function() {
      desktopMouseMode = !desktopMouseMode;
      dtMouseBtn.textContent = desktopMouseMode ? 'Select' : 'Scroll';
      dtMouseBtn.classList.toggle('accent', desktopMouseMode);
      if (desktopMouseMode) {
        // Re-enable mouse tracking in xterm.js by writing enable sequences
        term.write('\x1b[?1000h\x1b[?1006h');
      } else {
        // Disable mouse tracking in xterm.js
        term.write('\x1b[?1000l\x1b[?1003l\x1b[?1006l');
      }
      term.focus();
    });
  }

  // Desktop copy/paste: Ctrl+Shift+C/V, and Ctrl+C copies when text selected
  if (!isMobile) {
    term.attachCustomKeyEventHandler(function(ev) {
      if (ev.type !== 'keydown') return true;
      // Ctrl+Shift+C or Ctrl+C with selection → copy
      if (ev.ctrlKey && ev.key === 'c' && term.hasSelection()) {
        navigator.clipboard.writeText(term.getSelection());
        term.clearSelection();
        return false;
      }
      if (ev.ctrlKey && ev.shiftKey && ev.key === 'C') {
        if (term.hasSelection()) navigator.clipboard.writeText(term.getSelection());
        return false;
      }
      // Ctrl+Shift+V → paste
      if (ev.ctrlKey && ev.shiftKey && ev.key === 'V') {
        navigator.clipboard.readText().then(function(t) { sendInput(t); });
        return false;
      }
      return true;
    });
  }

  function doFit() { fitAddon.fit(); sendResize(); }

  // ---- State ----
  var container = document.getElementById('container');
  var customKb = document.getElementById('custom-kb');
  var nokb = document.getElementById('nokb');
  var withkb = document.getElementById('withkb');
  var kbVisible = false;       // custom keyboard shown
  var iosKbMode = false;       // iOS native keyboard mode
  var shiftActive = false;
  var ctrlActive = false;
  var symMode = false;         // symbols layout
  var currentTab = 1;          // track active tmux tab

  // ---- Focus Management ----
  function maintainFocus() {
    if (!isMobile) return;
    if (iosKbMode) {
      withkb.focus();
    } else {
      nokb.focus();
    }
  }

  // Forward iOS keyboard input
  function onHiddenInput(e) {
    var val = e.target.value;
    if (val) { sendInput(val); e.target.value = ''; }
  }
  nokb.addEventListener('input', onHiddenInput);
  withkb.addEventListener('input', onHiddenInput);
  withkb.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); sendInput('\r'); }
  });

  // ---- Custom Keyboard ----
  // Layout definitions
  var LETTERS = [
    { keys: '1234567890', cls: 'kb-num-row' },
    { keys: 'qwertyuiop' },
    { keys: 'asdfghjkl', inset: true },
    { keys: '_SHIFT_zxcvbnm_BKSP_', inset: false },
    { keys: '_SYM__CTRL__SLASH__SPACE__DOT__DASH__ENTER_', inset: false }
  ];
  var SYMBOLS = [
    { keys: '!@#$%^&*()', cls: 'kb-num-row' },
    { keys: '~`_+=|\\{}:' },
    { keys: '"\';<>[]?', inset: true },
    { keys: '_ABC_zxcvbnm_BKSP_', inset: false },
    { keys: '_SYM2__CTRL__SLASH__SPACE__DOT__DASH__ENTER_', inset: false }
  ];
  var SYMBOLS2 = [
    { keys: '1234567890', cls: 'kb-num-row' },
    { keys: '!@#$%^&*()', inset: false },
    { keys: '~`_+=|\\{}', inset: false },
    { keys: '_ABC_:<>[]?;_BKSP_', inset: false },
    { keys: '_SYM__CTRL__SLASH__SPACE__DOT__DASH__ENTER_', inset: false }
  ];

  // Long-press symbol mappings for letter keys
  var LP_MAP = {
    'q':'!','w':'@','e':'#','r':'$','t':'%','y':'^','u':'&','i':'*','o':'(','p':')',
    'a':'~','s':'`','d':'_','f':'+','g':'=','h':'|','j':'\\','k':'{','l':'}',
    'z':'"','x':"'",'c':';','v':'<','b':'>','n':'[','m':']'
  };

  function buildKeyboard(layout) {
    customKb.innerHTML = '';
    layout.forEach(function(rowDef) {
      var row = document.createElement('div');
      row.className = 'kb-row' + (rowDef.cls ? ' ' + rowDef.cls : '');

      // Parse keys - special keys wrapped in underscores
      var keys = [];
      var i = 0, str = rowDef.keys;
      while (i < str.length) {
        if (str[i] === '_') {
          var end = str.indexOf('_', i + 1);
          if (end !== -1) {
            keys.push(str.substring(i + 1, end));
            i = end + 1;
          } else {
            keys.push(str[i]); i++;
          }
        } else {
          keys.push(str[i]); i++;
        }
      }

      keys.forEach(function(k) {
        var btn = document.createElement('button');
        btn.className = 'kb-key';

        switch (k) {
          case 'SHIFT':
            btn.textContent = '\u21e7';
            btn.className += ' dark wide';
            btn.dataset.special = 'shift';
            if (shiftActive) btn.classList.add('active');
            break;
          case 'BKSP':
            btn.textContent = '\u232b';
            btn.className += ' dark wide';
            btn.dataset.special = 'bksp';
            break;
          case 'SYM':
            btn.textContent = '#+=';
            btn.className += ' dark wide';
            btn.dataset.special = 'sym';
            break;
          case 'SYM2':
            btn.textContent = '123';
            btn.className += ' dark wide';
            btn.dataset.special = 'sym2';
            break;
          case 'ABC':
            btn.textContent = 'ABC';
            btn.className += ' dark wide';
            btn.dataset.special = 'abc';
            break;
          case 'CTRL':
            btn.textContent = 'Ctrl';
            btn.className += ' dark';
            btn.dataset.special = 'ctrl';
            if (ctrlActive) btn.classList.add('active');
            break;
          case 'SPACE':
            btn.textContent = ' ';
            btn.className += ' space';
            btn.dataset.char = ' ';
            break;
          case 'ENTER':
            btn.textContent = '\u21b5';
            btn.className += ' dark';
            btn.style.flex = '1.2';
            btn.dataset.special = 'enter';
            break;
          case 'SLASH':
            btn.textContent = '/';
            btn.dataset.char = '/';
            break;
          case 'DOT':
            btn.textContent = '.';
            btn.dataset.char = '.';
            break;
          case 'DASH':
            btn.textContent = '-';
            btn.dataset.char = '-';
            break;
          default:
            // Regular character key
            var display = (shiftActive && k.length === 1 && k >= 'a' && k <= 'z') ? k.toUpperCase() : k;
            btn.textContent = display;
            btn.dataset.char = k;
            // Add long-press hint for letter keys
            if (LP_MAP[k] && !symMode) {
              var hint = document.createElement('span');
              hint.className = 'lp-hint';
              hint.textContent = LP_MAP[k];
              btn.appendChild(hint);
            }
            break;
        }

        row.appendChild(btn);
      });

      customKb.appendChild(row);
    });

    // Wire up touch events
    customKb.querySelectorAll('.kb-key').forEach(function(btn) {
      var longTimer = null;
      var fired = false;
      var popup = null;

      btn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        fired = false;
        var ch = btn.dataset.char;

        // Long-press for symbol hint
        if (ch && LP_MAP[ch.toLowerCase()] && !symMode) {
          longTimer = setTimeout(function() {
            fired = true;
            var sym = LP_MAP[ch.toLowerCase()];
            sendInput(sym);
            // Show popup
            popup = document.createElement('div');
            popup.className = 'kb-popup show';
            popup.textContent = sym;
            btn.appendChild(popup);
            setTimeout(function() {
              if (popup && popup.parentNode) popup.parentNode.removeChild(popup);
              popup = null;
            }, 400);
          }, 300);
        }
      });

      btn.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (longTimer) { clearTimeout(longTimer); longTimer = null; }
        if (fired) return;

        var ch = btn.dataset.char;
        var sp = btn.dataset.special;

        if (ch) {
          var out = ch;
          if (shiftActive && ch.length === 1 && ch >= 'a' && ch <= 'z') {
            out = ch.toUpperCase();
          }
          if (ctrlActive && out.length === 1) {
            // Ctrl+letter: send control character
            var code = out.toUpperCase().charCodeAt(0) - 64;
            if (code >= 0 && code <= 31) {
              sendInput(String.fromCharCode(code));
            }
            ctrlActive = false;
            rebuildCurrent();
            return;
          }
          sendInput(out);
          if (shiftActive) {
            shiftActive = false;
            rebuildCurrent();
          }
        } else if (sp) {
          switch (sp) {
            case 'shift':
              shiftActive = !shiftActive;
              rebuildCurrent();
              break;
            case 'bksp':
              sendInput('\x7f');
              break;
            case 'enter':
              sendInput('\r');
              break;
            case 'ctrl':
              ctrlActive = !ctrlActive;
              rebuildCurrent();
              break;
            case 'sym':
              symMode = true;
              buildKeyboard(SYMBOLS);
              break;
            case 'sym2':
              symMode = true;
              buildKeyboard(SYMBOLS2);
              break;
            case 'abc':
              symMode = false;
              buildKeyboard(LETTERS);
              break;
          }
        }
      });

      btn.addEventListener('touchcancel', function() {
        if (longTimer) { clearTimeout(longTimer); longTimer = null; }
      });
    });
  }

  function rebuildCurrent() {
    if (symMode) buildKeyboard(SYMBOLS);
    else buildKeyboard(LETTERS);
  }

  // ---- Keyboard show/hide ----
  function updateKbLabel() {
    var btn = document.getElementById('kb-show');
    btn.textContent = (iosKbMode || kbVisible) ? '\u2715' : 'ABC';
  }

  function showCustomKb() {
    kbVisible = true;
    customKb.classList.add('visible');
    buildKeyboard(LETTERS);
    symMode = false; shiftActive = false; ctrlActive = false;
    updateKbLabel();
    updateLayout();
  }

  function hideCustomKb() {
    kbVisible = false;
    customKb.classList.remove('visible');
    updateKbLabel();
    updateLayout();
  }

  function dismissAllKeyboards() {
    hideCustomKb();
    iosKbMode = false;
    nokb.focus();
    updateKbLabel();
  }

  // ---- Shortcut Bar ----
  var kbShowBtn = document.getElementById('kb-show');
  var ctrlToggleBtn = document.getElementById('ctrl-toggle');

  function setupTouchBtn(btn, fn) {
    var touchHandled = false;
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); });
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      touchHandled = true;
      fn();
      setTimeout(function() { touchHandled = false; }, 300);
    });
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      if (!touchHandled) fn();
    });
  }

  // ABC/dismiss button: tap = cycle keyboards, long-press = dismiss all
  var abcLongTimer = null, abcFired = false;
  kbShowBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    abcFired = false;
    abcLongTimer = setTimeout(function() {
      abcFired = true;
      dismissAllKeyboards();
    }, 500);
  });
  kbShowBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (abcLongTimer) { clearTimeout(abcLongTimer); abcLongTimer = null; }
    if (abcFired) return;
    if (iosKbMode) {
      // iOS KB visible -> switch to custom KB
      iosKbMode = false;
      nokb.focus();
      setTimeout(showCustomKb, 100);
    } else if (kbVisible) {
      // Custom KB visible -> switch to iOS KB
      hideCustomKb();
      iosKbMode = true;
      withkb.focus();
      updateKbLabel();
    } else {
      // No KB -> show iOS KB
      iosKbMode = true;
      withkb.focus();
      updateKbLabel();
    }
  });
  kbShowBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (!('ontouchend' in window)) {
      // Desktop: toggle custom kb
      if (kbVisible) hideCustomKb();
      else showCustomKb();
    }
  });

  // Ctrl toggle in shortcut bar
  setupTouchBtn(ctrlToggleBtn, function() {
    ctrlActive = !ctrlActive;
    ctrlToggleBtn.classList.toggle('active', ctrlActive);
    if (kbVisible) rebuildCurrent();
    maintainFocus();
  });

  // Action buttons in shortcut bar
  document.querySelectorAll('#shortcut-bar [data-action]').forEach(function(btn) {
    setupTouchBtn(btn, function() {
      var action = btn.getAttribute('data-action');
      var seq = ACTIONS[action];
      if (seq) sendInput(seq);
      maintainFocus();
    });
  });

  // ---- Tab bar ----
  var tab1Btn = document.getElementById('tab1-btn');

  function updateTab1Button() {
    if (currentTab === 1) {
      tab1Btn.textContent = '+';
      tab1Btn.classList.add('accent');
    } else {
      tab1Btn.textContent = '1';
      tab1Btn.classList.remove('accent');
    }
  }

  document.querySelectorAll('#tab-bar [data-tab]').forEach(function(btn) {
    setupTouchBtn(btn, function() {
      var n = btn.getAttribute('data-tab');
      var tabNum = parseInt(n, 10);

      if (tabNum === 1 && currentTab === 1) {
        // Already on tab 1 — launch project picker
        sendInput('cl\r');
      } else {
        // Switch to the requested tab
        sendInput('\x1b' + n);
        currentTab = tabNum;
      }

      // Highlight active tab
      document.querySelectorAll('#tab-bar button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      updateTab1Button();
      maintainFocus();
    });
  });

  // Initialize tab 1 as active
  tab1Btn.classList.add('active');
  updateTab1Button();

  // ---- Desktop toolbar ----
  var dtNewSession = document.getElementById('dt-new-session');
  if (dtNewSession) {
    dtNewSession.addEventListener('click', function() {
      // Alt+1 to switch to window 1, then clear screen and launch project picker
      sendInput('\x1b1');
      currentTab = 1;
      updateDesktopTabs();
      setTimeout(function() {
        sendInput('\x0c');  // Ctrl+L: clear screen
        setTimeout(function() { sendInput('cl\r'); }, 100);
      }, 150);
    });
  }

  function updateDesktopTabs() {
    document.querySelectorAll('#desktop-toolbar .dtab').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.getAttribute('data-dtab'), 10) === currentTab);
    });
  }

  document.querySelectorAll('#desktop-toolbar .dtab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var n = btn.getAttribute('data-dtab');
      var tabNum = parseInt(n, 10);
      sendInput('\x1b' + n);
      currentTab = tabNum;
      updateDesktopTabs();
    });
  });

  updateDesktopTabs();

  // Terminal tap — open iOS keyboard by default
  if (isMobile) {
    document.getElementById('terminal').addEventListener('touchend', function(e) {
      if (window.getSelection().toString()) return;
      // Don't focus if tap was near the scroll control (right 60px)
      if (e.changedTouches && e.changedTouches[0]) {
        var tx = e.changedTouches[0].clientX;
        if (tx > window.innerWidth - 60) return;
      }
      if (!kbVisible) {
        iosKbMode = true;
        withkb.focus();
        updateKbLabel();
      }
    });
  }

  // ---- Layout ----
  function updateLayout() {
    var h = (window.visualViewport) ? window.visualViewport.height : window.innerHeight;
    container.style.height = h + 'px';
    doFit();
  }

  var resizeTimer, lastWidth = window.innerWidth;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      var w = window.innerWidth;
      if (w !== lastWidth) {
        lastWidth = w;
        isMobile = w < 769;
        var newSize = getResponsiveFontSize();
        if (term.options.fontSize !== newSize) term.options.fontSize = newSize;
      }
      updateLayout();
    }, 50);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      updateLayout();
    });
  }

  // Prevent iOS viewport scrolling
  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  // Two-finger swipe on terminal area scrolls buffer
  (function() {
    var termEl = document.getElementById('terminal');
    var startY = null, accum = 0, scrolling = false;

    termEl.addEventListener('touchstart', function(e) {
      if (e.touches.length === 2) {
        scrolling = true;
        startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        accum = 0;
      }
    }, { passive: true });

    termEl.addEventListener('touchmove', function(e) {
      if (scrolling && e.touches.length === 2) {
        var y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        accum += (startY - y);
        startY = y;
        var lines = Math.trunc(accum / 15);
        if (lines !== 0) {
          term.scrollLines(lines);
          accum -= lines * 15;
        }
      }
    }, { passive: true });

    termEl.addEventListener('touchend', function() {
      scrolling = false; startY = null; accum = 0;
    });
    termEl.addEventListener('touchcancel', function() {
      scrolling = false; startY = null; accum = 0;
    });
  })();

  // ---- Scroll pill control ----
  var scrollBtnsDiv = document.getElementById('scroll-btns');
  var scrollPill = document.getElementById('scroll-pill');

  function positionScrollBtns() {
    var bar = document.getElementById('shortcut-bar');
    var barRect = bar.getBoundingClientRect();
    scrollBtnsDiv.style.bottom = (window.innerHeight - barRect.top + 8) + 'px';
  }

  (function setupScrollPill() {
    var active = false;
    var scrollInterval = null;
    var scrollSpeed = 0;

    function getSpeed(clientY) {
      var rect = scrollPill.getBoundingClientRect();
      var relY = Math.max(0, Math.min(rect.height, clientY - rect.top));
      var pct = (relY / rect.height - 0.5) * 2; // -1 to 1
      // Dead zone in center
      if (Math.abs(pct) < 0.15) return 0;
      return pct;
    }

    function doScroll() {
      if (scrollSpeed === 0) return;
      var lines = Math.round(scrollSpeed * 8);
      try { term.scrollLines(lines); } catch(e) {}
      var vp = document.querySelector('.xterm-viewport');
      if (vp) {
        vp.dispatchEvent(new WheelEvent('wheel', {
          deltaY: lines * 30, deltaMode: 0, bubbles: true
        }));
      }
    }

    scrollPill.addEventListener('touchstart', function(e) {
      e.preventDefault();
      e.stopPropagation();
      active = true;
      scrollSpeed = getSpeed(e.touches[0].clientY);
      doScroll();
      scrollInterval = setInterval(doScroll, 80);
    });

    scrollPill.addEventListener('touchmove', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (active) scrollSpeed = getSpeed(e.touches[0].clientY);
    });

    function stopScroll() {
      active = false;
      scrollSpeed = 0;
      if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; }
    }

    scrollPill.addEventListener('touchend', function(e) {
      e.preventDefault();
      e.stopPropagation();
      stopScroll();
    });
    scrollPill.addEventListener('touchcancel', stopScroll);

    // Desktop fallback
    scrollPill.addEventListener('mousedown', function(e) {
      e.preventDefault();
      active = true;
      scrollSpeed = getSpeed(e.clientY);
      doScroll();
      scrollInterval = setInterval(doScroll, 80);
    });
    document.addEventListener('mousemove', function(e) {
      if (active) scrollSpeed = getSpeed(e.clientY);
    });
    document.addEventListener('mouseup', function() {
      if (active) stopScroll();
    });
  })();

  // Reposition on layout changes
  var origUpdateLayout = updateLayout;
  updateLayout = function() {
    origUpdateLayout();
    positionScrollBtns();
  };

// ---- Start ----
  updateLayout();
  connect();
})();
</script>
</body>
</html>
