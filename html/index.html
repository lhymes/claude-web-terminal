<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100dvh; height: 100%; background: #1e1e1e; overflow: hidden; }
  #terminal { height: 100dvh; height: 100%; width: 100%; }

  /* Toolbar: three states via classes on #toolbar */
  /* .collapsed = handle only, .compact = handle + primary, (default) = all rows */
  #toolbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #252526; border-top: 1px solid #3c3c3c;
    z-index: 10; transition: transform 0.2s ease;
  }
  #toolbar.collapsed { transform: translateY(calc(100% - 28px)); }
  #toolbar.compact .ext-row { display: none; }

  #toolbar-handle {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 28px;
    background: #2d2d2d; border: none; border-bottom: 1px solid #3c3c3c;
    color: #808080; font-size: 12px; cursor: pointer;
    touch-action: manipulation; gap: 8px;
  }
  #toolbar-handle:active { background: #3c3c3c; }
  #toolbar-handle .grip {
    width: 32px; height: 4px; border-radius: 2px;
    background: #555;
  }

  .btn-row {
    display: flex; flex-wrap: nowrap; padding: 4px 3px;
    gap: 4px;
  }
  .btn-row button {
    flex: 1 1 0; min-width: 40px; height: 44px;
    background: #333; border: 1px solid #555; border-radius: 6px;
    color: #d4d4d4; font-size: 13px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    white-space: nowrap; padding: 0 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-row button:active { background: #569cd6; color: #1e1e1e; }
  .btn-row button.accent {
    background: #264f78; border-color: #569cd6;
  }
  .btn-row button.accent:active { background: #569cd6; }

  @media (min-width: 769px) {
    #toolbar { display: none; }
  }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="toolbar" class="collapsed">
  <button id="toolbar-handle"><span class="grip"></span></button>
  <!-- Primary row: essentials always visible in compact mode -->
  <div class="btn-row" id="primary-row">
    <button data-action="escape">Esc</button>
    <button data-action="interrupt">^C</button>
    <button data-action="tab">Tab</button>
    <button data-action="up">&uarr;</button>
    <button data-action="down">&darr;</button>
    <button data-action="left">&larr;</button>
    <button data-action="right">&rarr;</button>
    <button data-action="enter" class="accent">&#x23ce;</button>
  </div>
  <!-- Extended rows: visible only in full mode -->
  <div class="btn-row ext-row">
    <button data-action="window-1">1</button>
    <button data-action="window-2">2</button>
    <button data-action="window-3">3</button>
    <button data-action="window-4">4</button>
    <button data-action="window-5">5</button>
    <button data-action="window-6">6</button>
    <button data-action="window-7">7</button>
    <button data-action="window-8">8</button>
    <button data-action="window-9">9</button>
  </div>
  <div class="btn-row ext-row">
    <button data-action="eof">^D</button>
    <button data-action="clear">^L</button>
    <button data-action="cmd-exit">/exit</button>
    <button data-action="cmd-help">/help</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(function() {
  // ---- Action Registry ----
  // Semantic action names mapped to terminal sequences.
  // To customize, modify this object — no HTML changes needed.
  var ACTIONS = {
    'escape':    '\x1b',
    'interrupt': '\x03',
    'eof':       '\x04',
    'tab':       '\x09',
    'enter':     '\r',
    'clear':     '\x0c',
    'up':        '\x1b[A',
    'down':      '\x1b[B',
    'left':      '\x1b[D',
    'right':     '\x1b[C',
    'window-1':  '\x1b1',
    'window-2':  '\x1b2',
    'window-3':  '\x1b3',
    'window-4':  '\x1b4',
    'window-5':  '\x1b5',
    'window-6':  '\x1b6',
    'window-7':  '\x1b7',
    'window-8':  '\x1b8',
    'window-9':  '\x1b9',
    'cmd-exit':  '/exit\r',
    'cmd-help':  '/help\r'
  };

  // ---- Terminal Setup ----
  var term = new Terminal({
    fontSize: 14,
    fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
    theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#d4d4d4' },
    cursorBlink: true,
    allowProposedApi: true
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));

  // ---- WebSocket ----
  var ws = null;

  function textEncoder(str) {
    return new TextEncoder().encode(str);
  }

  function sendInput(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var encoded = typeof data === 'string' ? textEncoder(data) : data;
    var payload = new Uint8Array(encoded.length + 1);
    payload[0] = 0;
    payload.set(encoded, 1);
    ws.send(payload);
  }

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var json = JSON.stringify({ columns: term.cols, rows: term.rows });
    var encoded = textEncoder(json);
    var payload = new Uint8Array(encoded.length + 1);
    payload[0] = 1;
    payload.set(encoded, 1);
    ws.send(payload);
  }

  function connect() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = protocol + '//' + location.host + '/ws';
    ws = new WebSocket(url, ['tty']);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function() {
      fitAddon.fit();
      var authMsg = JSON.stringify({
        AuthToken: '',
        columns: term.cols,
        rows: term.rows
      });
      var encoded = textEncoder(authMsg);
      var payload = new Uint8Array(encoded.length + 1);
      payload[0] = 0;
      payload.set(encoded, 1);
      ws.send(payload);
    };

    ws.onmessage = function(ev) {
      if (typeof ev.data === 'string') return;
      var data = new Uint8Array(ev.data);
      var cmd = data[0];
      var body = data.slice(1);
      switch (cmd) {
        case 0: term.write(body); break;
        case 1: document.title = new TextDecoder().decode(body); break;
      }
    };

    ws.onclose = function() {
      term.write('\r\n\x1b[33mConnection closed. Reconnecting...\x1b[0m\r\n');
      setTimeout(connect, 2000);
    };

    ws.onerror = function() { ws.close(); };
  }

  term.onData(function(data) { sendInput(data); });

  // ---- Resize Handling ----
  function doFit() {
    fitAddon.fit();
    sendResize();
  }

  window.addEventListener('resize', doFit);
  new ResizeObserver(doFit).observe(document.getElementById('terminal'));

  // ---- Toolbar: Three-State Toggle ----
  // States: collapsed (handle only) → compact (primary row) → full (all rows)
  var toolbar = document.getElementById('toolbar');
  var handle = document.getElementById('toolbar-handle');
  var toolbarState = 'collapsed'; // collapsed | compact | full

  function setToolbarState(state) {
    toolbarState = state;
    toolbar.className = (state === 'collapsed') ? 'collapsed' :
                        (state === 'compact')   ? 'compact' : '';
    adjustHeight();
  }

  handle.addEventListener('click', function() {
    if (toolbarState === 'collapsed') setToolbarState('compact');
    else if (toolbarState === 'compact') setToolbarState('full');
    else setToolbarState('collapsed');
  });

  // ---- Action Dispatch ----
  document.querySelectorAll('[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      var action = btn.getAttribute('data-action');
      var seq = ACTIONS[action];
      if (seq) {
        sendInput(seq);
        term.focus();
      }
    });
    btn.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  });

  // ---- Height Adjustment ----
  function adjustHeight() {
    var termEl = document.getElementById('terminal');
    if (window.innerWidth >= 769) {
      termEl.style.height = '100%';
    } else {
      var tbHeight;
      if (toolbarState === 'collapsed') {
        tbHeight = 28;
      } else {
        tbHeight = toolbar.offsetHeight;
      }
      termEl.style.height = 'calc(100% - ' + tbHeight + 'px)';
    }
    setTimeout(doFit, 50);
  }

  window.addEventListener('resize', adjustHeight);

  // iOS Safari: position:fixed breaks when soft keyboard opens.
  // Use visualViewport API to reposition toolbar above keyboard.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      var vv = window.visualViewport;
      // Offset toolbar so it sits above the keyboard, not behind it
      toolbar.style.bottom = (window.innerHeight - vv.height - vv.offsetTop) + 'px';
      adjustHeight();
    });
    window.visualViewport.addEventListener('scroll', function() {
      var vv = window.visualViewport;
      toolbar.style.bottom = (window.innerHeight - vv.height - vv.offsetTop) + 'px';
    });
  }

  // ---- Start ----
  adjustHeight();
  connect();
})();
</script>
</body>
</html>
