<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Code">
<meta name="theme-color" content="#1e1e1e">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100dvh; background: #1e1e1e; overflow: hidden;
    position: fixed; width: 100%;
  }

  #container {
    display: flex; flex-direction: column;
    height: 100dvh; width: 100%;
    overflow: hidden;
  }

  #terminal {
    flex: 1; min-height: 0; width: 100%; overflow: hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #terminal .xterm-viewport { scrollbar-width: none; }
  #terminal .xterm-viewport::-webkit-scrollbar { display: none; }

  /* ---- Shortcut bar (always visible on mobile) ---- */
  #shortcut-bar {
    flex: none;
    display: flex; flex-wrap: nowrap;
    padding: 2px 3px; gap: 3px;
    background: #252526; border-top: 1px solid #3c3c3c;
  }
  #shortcut-bar button {
    flex: 1 1 0; min-width: 32px; height: 30px;
    background: #333; border: 1px solid #555; border-radius: 5px;
    color: #d4d4d4; font-size: 12px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    white-space: nowrap; padding: 0 2px;
    -webkit-tap-highlight-color: transparent;
  }
  #shortcut-bar button:active { background: #569cd6; color: #1e1e1e; }
  #shortcut-bar button.accent { background: #264f78; border-color: #569cd6; }
  #shortcut-bar button.active { background: #569cd6; color: #1e1e1e; }
  #kb-keys, #kb-tabs { display: contents; }
  #kb-tabs { display: none; }
  #shortcut-bar.tabs-mode #kb-keys { display: none; }
  #shortcut-bar.tabs-mode #kb-tabs { display: contents; }

  /* ---- Input Bubble (mobile only) ---- */
  #input-bubble {
    flex: none;
    background: transparent;
    padding: 0 4px 1px 4px;
    transition: all 0.2s ease;
    position: relative;
  }
  /* Minimized: compact pill + action buttons in a single row */
  #input-bubble:not(.bubble-expanded) {
    display: flex; align-items: center; gap: 3px; flex-wrap: nowrap;
    padding: 0 4px 1px 4px;
  }
  #input-bubble:not(.bubble-expanded) #bubble-row { flex: 1; }
  #input-bubble:not(.bubble-expanded) #bubble-tabs { padding: 0; }
  #input-bubble:not(.bubble-expanded) #bubble-expanded { display: none; }
  #bubble-tabs {
    display: flex;
    gap: 3px;
    z-index: 1;
    justify-content: flex-end;
    padding: 0 2px 2px 0;
  }
  #bubble-tabs button {
    height: 30px; min-width: 40px;
    background: #333; border: 1px solid #555; border-radius: 5px;
    color: #d4d4d4; font-size: 12px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    padding: 0 6px;
  }
  #bubble-tabs button:active { background: #569cd6; color: #1e1e1e; }
  #bubble-tabs #btn-enter { background: #264f78; border-color: #569cd6; color: #569cd6; }
  #bubble-tabs #btn-enter:active { background: #3a6a9e; }
  #bubble-tabs #btn-interrupt { background: #782626; border-color: #d65656; color: #d65656; }
  #bubble-tabs #btn-interrupt:active { background: #9e3a3a; }
  #bubble-pill {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(86, 156, 214, 0.2);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(86, 156, 214, 0.35);
    border-radius: 20px;
    padding: 6px 14px;
    color: #d4d4d4; font-size: 13px; font-family: monospace;
    cursor: pointer; min-height: 36px;
    -webkit-tap-highlight-color: transparent;
  }
  #bubble-preview { opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #bubble-count { opacity: 0.5; font-size: 11px; margin-left: 8px; white-space: nowrap; }

  #bubble-expanded {
    display: none;
    background: rgba(30, 30, 30, 0.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid #3c3c3c;
    border-radius: 12px;
    padding: 8px;
  }
  .bubble-expanded #bubble-row { display: none; }
  .bubble-expanded #bubble-expanded { display: block; }

  #bubble-input {
    width: 100%; background: #2d2d2d; color: #d4d4d4;
    border: 1px solid #555; border-radius: 8px;
    padding: 10px; font-size: 16px;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    resize: none; min-height: 60px; max-height: 120px;
    line-height: 1.4;
  }
  #bubble-input::placeholder { color: #666; }

  #bubble-history-indicator {
    display: none; font-size: 11px; color: #888; font-family: monospace;
    margin-left: auto; padding: 0 4px; white-space: nowrap;
  }
  #bubble-actions {
    display: flex; gap: 6px; margin-top: 6px; align-items: center;
  }
  .bubble-btn {
    flex: 1; height: 44px;
    background: #333; border: 1px solid #555; border-radius: 8px;
    color: #d4d4d4; font-size: 14px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .bubble-btn:active { background: #555; }
  .bubble-half { flex: 0.5; min-width: 0; padding: 0; }
  .bubble-btn.accent { background: #264f78; border-color: #569cd6; color: #569cd6; }
  .bubble-btn.accent:active { background: #3a6a9e; }

  /* ---- Tab bar (tmux window switching) ---- */
  #tab-bar {
    flex: none;
    display: flex; flex-wrap: nowrap;
    padding: 2px 3px; gap: 2px;
    padding-top: env(safe-area-inset-top, 2px);
    background: #1e1e1e; border-bottom: 1px solid #3c3c3c;
  }
  #tab-bar button {
    flex: 1 1 0; height: 28px;
    background: #2d2d2d; border: none; border-radius: 4px;
    color: #d4d4d4; font-size: 13px; font-family: monospace;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #tab-bar button:active, #tab-bar button.active {
    background: #569cd6; color: #1e1e1e; font-weight: bold;
  }
  #tab-bar button.accent {
    background: #264f78; color: #569cd6; font-weight: bold;
  }

  /* ---- Desktop floating toolbar ---- */
  #desktop-toolbar {
    display: none;
    position: fixed;
    bottom: 4px; right: 30px;
    z-index: 9999;
    background: rgba(37, 37, 38, 0.92);
    border: 1px solid #3c3c3c;
    border-radius: 6px;
    padding: 3px 4px;
    gap: 3px;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #desktop-toolbar button {
    height: 26px; min-width: 28px;
    background: #333; border: 1px solid #555; border-radius: 4px;
    color: #d4d4d4; font-size: 12px; font-family: monospace;
    cursor: pointer; padding: 0 8px;
    white-space: nowrap;
  }
  #desktop-toolbar button:hover { background: #444; border-color: #666; }
  #desktop-toolbar button:active { background: #569cd6; color: #1e1e1e; }
  #desktop-toolbar button.accent {
    background: #264f78; border-color: #569cd6; color: #569cd6;
  }
  #desktop-toolbar button.accent:hover { background: #2d5f8a; }
  #desktop-toolbar .dtab { min-width: 24px; padding: 0 5px; }
  #desktop-toolbar .dtab.active { background: #569cd6; color: #1e1e1e; border-color: #569cd6; }
  #dt-content { display: inline-flex; align-items: center; gap: 3px; }

  @media (max-width: 768px) {
    #desktop-toolbar { display: none !important; }
    #tab-bar { display: none; }
  }
  /* Landscape mobile: compact shortcut bar */
  @media (max-width: 768px) and (orientation: landscape) {
    #shortcut-bar { padding: 1px 3px 0 3px; }
    #shortcut-bar button { height: 28px; font-size: 10px; }
  }

  @media (min-width: 769px) {
    #tab-bar { display: none; }
    #shortcut-bar { display: none; }
    #input-bubble { display: none !important; }
    #desktop-toolbar { display: flex; }
  }
</style>
</head>

</div>

    <button id="dt-mini-mode" title="Toggle mode" style="min-width:24px;padding:0 4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="6" y1="21" x2="18" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/><rect x="6" y="8" width="4" height="3" rx="0.5"/></svg></button>
    <button id="dt-mini-new" title="New session" style="min-width:24px;padding:0 4px;">+</button>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(function() {
  // ---- Terminal Actions (shortcut bar) ----
  var ACTIONS = {
    'escape':  '\x1b', 'interrupt': '\x03', 'eof': '\x04',
    'tab':     '\x09', 'enter':     '\r',   'clear': '\x0c',
    'up':      '\x1b[A', 'down':  '\x1b[B',
    'left':    '\x1b[D', 'right': '\x1b[C'
  };

  // ---- Responsive Font Size ----
  function getResponsiveFontSize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    if (w < 769 && w > h) return 10;
    if (w <= 360) return 11;
    if (w <= 428) return 12;
    return 14;
  }

  // ---- Terminal Setup ----
  var term = new Terminal({
    fontSize: getResponsiveFontSize(),
    fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
    theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#d4d4d4' },
    cursorBlink: true,
    allowProposedApi: true
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));

  // ---- WebSocket ----
  var ws = null;
  var isMobile = window.innerWidth < 769;
  function sendInput(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send('0' + data);
  }
  function sendInputChunked(text) {
    var chunk = 4096;
    if (text.length <= chunk) { sendInput(text); return; }
    for (var i = 0; i < text.length; i += chunk) {
      (function(part, delay) {
        setTimeout(function() { sendInput(part); }, delay);
      })(text.substring(i, i + chunk), (i / chunk) * 50);
    }
  }
  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send('1' + JSON.stringify({ columns: term.cols, rows: term.rows }));
  }

  var currentTab = 1;

  function syncTitle(title) {
    document.title = title;
    // Extract tab number: match leading digit, or "N:" prefix, or standalone digit
    var m = title.match(/^(\d)/);
    var tabNum = m ? parseInt(m[1], 10) : 0;
    if (tabNum >= 1 && tabNum <= 9 && tabNum !== currentTab) {
      currentTab = tabNum;
      updateTab1Button();
      updateDesktopTabs();
      updateShortcutTabHighlight();
    }
  }

  // Also catch in-band OSC title changes from tmux (backup sync)
  term.onTitleChange(function(title) { syncTitle(title); });

  function connect() {
    if (ws) {
      ws.onclose = null; ws.onerror = null;
      if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) ws.close();
      ws = null;
    }
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var sock = new WebSocket(protocol + '//' + location.host + '/ws', ['tty']);
    sock.binaryType = 'arraybuffer';
    sock.onopen = function() {
      ws = sock;
      fitAddon.fit();
      ws.send(JSON.stringify({ AuthToken: '', columns: term.cols, rows: term.rows }));
    };
    sock.onmessage = function(ev) {
      if (typeof ev.data === 'string') {
        var cmd = ev.data[0], body = ev.data.substring(1);
        switch (cmd) {
          case '0': term.write(body); break;
          case '1': syncTitle(body); break;
        }
      } else {
        var d = new Uint8Array(ev.data), cmd = String.fromCharCode(d[0]), body = d.subarray(1);
        switch (cmd) {
          case '0': term.write(body); break;
          case '1': syncTitle(new TextDecoder().decode(body)); break;
        }
      }
    };
    sock.onclose = function() {
      ws = null;
      term.write('\r\n\x1b[33mConnection closed. Reconnecting...\x1b[0m\r\n');
      setTimeout(connect, 2000);
    };
    sock.onerror = function() { sock.close(); };
  }
  term.onData(function(data) { sendInput(data); });

  // Desktop mouse mode toggle
  var desktopMouseMode = false;
  if (!isMobile) {
    var mouseTrackParams = { 9:1, 1000:1, 1001:1, 1002:1, 1003:1, 1006:1, 1015:1 };
    term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, function(params) {
      if (desktopMouseMode) return false;
      for (var i = 0; i < params.length; i++) {
        if (mouseTrackParams[params[i]]) return true;
      }
      return false;
    });

    var dtMouseBtn = document.getElementById('dt-mouse-toggle');
    dtMouseBtn.addEventListener('click', function() {
      desktopMouseMode = !desktopMouseMode;
      dtMouseBtn.innerHTML = desktopMouseMode
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="8" y="2" width="8" height="16" rx="4"/><line x1="12" y1="6" x2="12" y2="10"/><line x1="12" y1="22" x2="12" y2="18"/><line x1="8" y1="22" x2="16" y2="22"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="6" y1="21" x2="18" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/><rect x="6" y="8" width="4" height="3" rx="0.5"/></svg>';
      if (desktopMouseMode) {
        term.write('\x1b[?1000h\x1b[?1006h');
      } else {
        term.write('\x1b[?1000l\x1b[?1003l\x1b[?1006l');
      }
      term.focus();
    });
  }

  // Desktop copy/paste
  if (!isMobile) {
    term.attachCustomKeyEventHandler(function(ev) {
      if (ev.type !== 'keydown') return true;
      if (ev.ctrlKey && ev.key === 'c' && term.hasSelection()) {
        navigator.clipboard.writeText(term.getSelection());
        term.clearSelection();
        return false;
      }
      if (ev.ctrlKey && ev.shiftKey && ev.key === 'C') {
        if (term.hasSelection()) navigator.clipboard.writeText(term.getSelection());
        return false;
      }
      if (ev.ctrlKey && ev.shiftKey && ev.key === 'V') {
        navigator.clipboard.readText().then(function(t) { sendInput(t); });
        return false;
      }
      return true;
    });
  }

  function doFit() { fitAddon.fit(); sendResize(); }

  // ---- State ----
  var container = document.getElementById('container');

  // ---- Input Bubble (mobile) ----
  var bubble = document.getElementById('input-bubble');
  var bubblePill = document.getElementById('bubble-pill');
  var bubbleInput = document.getElementById('bubble-input');
  var bubblePreview = document.getElementById('bubble-preview');
  var bubbleCount = document.getElementById('bubble-count');
  var bubbleSend = document.getElementById('bubble-send');
  var bubbleMin = document.getElementById('bubble-min');
  var bubbleClear = document.getElementById('bubble-clear');
  var bubbleIsExpanded = false;

  // ---- Chat Bubble History ----
  var bubbleHistory = JSON.parse(localStorage.getItem('bubble-history') || '[]');
  var historyIdx = -1;
  var historyDraft = '';
  var historyIndicator = document.getElementById('bubble-history-indicator');

  function saveHistory(text) {
    if (!text) return;
    if (bubbleHistory.length > 0 && bubbleHistory[bubbleHistory.length - 1] === text) return;
    bubbleHistory.push(text);
    if (bubbleHistory.length > 100) bubbleHistory = bubbleHistory.slice(-100);
    localStorage.setItem('bubble-history', JSON.stringify(bubbleHistory));
    historyIdx = -1;
    historyDraft = '';
    updateHistoryIndicator();
  }

  function updateHistoryIndicator() {
    if (historyIdx < 0) {
      historyIndicator.style.display = 'none';
    } else {
      historyIndicator.style.display = '';
      historyIndicator.textContent = '\u2191 ' + (bubbleHistory.length - historyIdx) + '/' + bubbleHistory.length;
    }
  }

  function expandBubble() {
    bubbleIsExpanded = true;
    bubble.className = 'bubble-expanded';
    bubbleInput.focus();
    // Prevent iOS from scrolling the page to reveal the input
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    updateLayout();
    // Delayed refit to catch keyboard animation completing
    setTimeout(updateLayout, 150);
    setTimeout(updateLayout, 400);
    if (bubbleHistory.length > 0) updateHistoryIndicator();
  }

  function minimizeBubble() {
    bubbleIsExpanded = false;
    bubble.className = '';
    bubbleInput.blur();
    updateBubblePill();
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    updateLayout();
    // Delayed refit to catch keyboard dismiss animation
    setTimeout(updateLayout, 150);
    setTimeout(updateLayout, 400);
  }

  function updateBubblePill() {
    var text = bubbleInput.value;
    if (text.length === 0) {
      bubblePreview.textContent = 'Tap to type';
      bubbleCount.textContent = '';
    } else {
      bubblePreview.textContent = text.length > 30 ? text.substring(0, 30) + '\u2026' : text;
      bubbleCount.textContent = text.length + '';
    }
  }

  if (isMobile) {
    bubblePill.addEventListener('touchend', function(e) {
      e.preventDefault();
      expandBubble();
    });

    bubbleSend.addEventListener('touchend', function(e) {
      e.preventDefault();
      var text = bubbleInput.value;
      if (text) {
        saveHistory(text);
        sendInputChunked(text);
        bubbleInput.value = '';
      }
      minimizeBubble();
    });

    bubbleInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        var text = bubbleInput.value;
        if (text) {
          saveHistory(text);
          sendInputChunked(text);
          bubbleInput.value = '';
        }
        minimizeBubble();
      } else if (e.key === 'ArrowUp' && bubbleInput.selectionStart === 0 && bubbleHistory.length > 0) {
        e.preventDefault();
        if (historyIdx < 0) historyDraft = bubbleInput.value;
        if (historyIdx < bubbleHistory.length - 1) {
          historyIdx = historyIdx < 0 ? bubbleHistory.length - 1 : historyIdx - 1;
          bubbleInput.value = bubbleHistory[historyIdx];
          updateBubblePill();
          updateHistoryIndicator();
        }
      } else if (e.key === 'ArrowDown' && historyIdx >= 0) {
        e.preventDefault();
        if (historyIdx < bubbleHistory.length - 1) {
          historyIdx++;
          bubbleInput.value = bubbleHistory[historyIdx];
        } else {
          historyIdx = -1;
          bubbleInput.value = historyDraft;
        }
        updateBubblePill();
        updateHistoryIndicator();
      }
    });

    bubbleMin.addEventListener('touchend', function(e) {
      e.preventDefault();
      minimizeBubble();
    });

    bubbleClear.addEventListener('touchend', function(e) {
      e.preventDefault();
      bubbleInput.value = '';
      updateBubblePill();
      bubbleInput.focus();
    });

    var bubbleHistoryUp = document.getElementById('bubble-history-up');
    var bubbleHistoryDown = document.getElementById('bubble-history-down');
    bubbleHistoryUp.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (bubbleHistory.length === 0) return;
      if (historyIdx < 0) historyDraft = bubbleInput.value;
      historyIdx = historyIdx < 0 ? bubbleHistory.length - 1 : (historyIdx > 0 ? historyIdx - 1 : bubbleHistory.length - 1);
      bubbleInput.value = bubbleHistory[historyIdx];
      updateBubblePill();
      updateHistoryIndicator();
    });
    bubbleHistoryDown.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (bubbleHistory.length === 0) return;
      if (historyIdx < 0) return;
      if (historyIdx < bubbleHistory.length - 1) {
        historyIdx++;
        bubbleInput.value = bubbleHistory[historyIdx];
      } else {
        historyIdx = -1;
        bubbleInput.value = historyDraft;
      }
      updateBubblePill();
      updateHistoryIndicator();
    });

    bubbleInput.addEventListener('input', updateBubblePill);
  }

  // ---- Shortcut Bar (mobile) ----
  function setupTouchBtn(btn, fn) {
    var touchHandled = false;
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); });
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      touchHandled = true;
      fn();
      setTimeout(function() { touchHandled = false; }, 300);
    });
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      if (!touchHandled) fn();
    });
  }

  // Bubble ^C/Enter tabs
  setupTouchBtn(document.getElementById('btn-interrupt'), function() { sendInput('\x03'); });
  setupTouchBtn(document.getElementById('btn-enter'), function() { sendInput('\r'); });

  // Keyboard mode toggle
  var kbMode = 'keys';
  var shortcutBar = document.getElementById('shortcut-bar');
  var kbSwap = document.getElementById('kb-swap');

  function updateShortcutTabHighlight() {
    document.querySelectorAll('#kb-tabs [data-stab]').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.getAttribute('data-stab'), 10) === currentTab);
    });
  }

  setupTouchBtn(kbSwap, function() {
    kbMode = kbMode === 'keys' ? 'tabs' : 'keys';
    shortcutBar.classList.toggle('tabs-mode', kbMode === 'tabs');
    if (kbMode === 'tabs') updateShortcutTabHighlight();
  });

  // Session tab buttons in shortcut bar
  document.querySelectorAll('#kb-tabs [data-stab]').forEach(function(btn) {
    setupTouchBtn(btn, function() {
      var n = btn.getAttribute('data-stab');
      var tabNum = parseInt(n, 10);
      if (tabNum === 1 && currentTab === 1) {
        sendInput('cl\r');
      } else {
        sendInput('\x1b' + n);
        currentTab = tabNum;
      }
      updateShortcutTabHighlight();
      updateTab1Button();
      updateDesktopTabs();
    });
  });

  // Shortcut bar buttons with repeat-on-hold for arrows
  document.querySelectorAll('#shortcut-bar [data-action]').forEach(function(btn) {
    var action = btn.getAttribute('data-action');
    var isArrow = (action === 'up' || action === 'down' || action === 'left' || action === 'right');

    if (action === 'new-session') {
      setupTouchBtn(btn, function() {
        sendInput('\x1b1');
        currentTab = 1;
        updateTab1Button();
        updateDesktopTabs();
        updateShortcutTabHighlight();
        setTimeout(function() {
          sendInput('\x0c');
          setTimeout(function() { sendInput('cl\r'); }, 100);
        }, 150);
      });
    } else if (action === 'prev-tab' || action === 'next-tab') {
      setupTouchBtn(btn, function() {
        if (action === 'prev-tab') {
          var prev = currentTab > 1 ? currentTab - 1 : 9;
          sendInput('\x1b' + prev);
          currentTab = prev;
        } else {
          var next = currentTab < 9 ? currentTab + 1 : 1;
          sendInput('\x1b' + next);
          currentTab = next;
        }
        updateTab1Button();
        updateDesktopTabs();
        updateShortcutTabHighlight();
      });
    } else if (isArrow) {
      var seq = ACTIONS[action];
      var repeatTimer = null;
      btn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        sendInput(seq);
        repeatTimer = setInterval(function() { sendInput(seq); }, 150);
      });
      btn.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
      });
      btn.addEventListener('touchcancel', function() {
        if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
      });
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        sendInput(seq);
      });
    } else {
      var seq = ACTIONS[action];
      setupTouchBtn(btn, function() {
        if (seq) sendInput(seq);
      });
    }
  });

  // ---- Tab bar ----
  var tab1Btn = document.getElementById('tab1-btn');

  function updateTab1Button() {
    if (currentTab === 1) {
      tab1Btn.textContent = '+';
      tab1Btn.classList.add('accent');
    } else {
      tab1Btn.textContent = '1';
      tab1Btn.classList.remove('accent');
    }
  }

  document.querySelectorAll('#tab-bar [data-tab]').forEach(function(btn) {
    setupTouchBtn(btn, function() {
      var n = btn.getAttribute('data-tab');
      var tabNum = parseInt(n, 10);

      if (tabNum === 1 && currentTab === 1) {
        sendInput('cl\r');
      } else {
        sendInput('\x1b' + n);
        currentTab = tabNum;
      }

      document.querySelectorAll('#tab-bar button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      updateTab1Button();
    });
  });

  tab1Btn.classList.add('active');
  updateTab1Button();

  // ---- Desktop toolbar collapse ----
  var dtCollapse = document.getElementById('dt-collapse');
  var dtContent = document.getElementById('dt-content');
  var dtMini = document.getElementById('dt-mini');
  if (dtCollapse && dtContent && dtMini) {
    var dtCollapsed = false;
    dtCollapse.addEventListener('click', function() {
      dtCollapsed = !dtCollapsed;
      dtContent.style.display = dtCollapsed ? 'none' : '';
      dtMini.style.display = dtCollapsed ? 'inline-flex' : 'none';
      dtCollapse.innerHTML = dtCollapsed ? '&#x25C2;' : '&#x25B8;';
      dtCollapse.title = dtCollapsed ? 'Expand toolbar' : 'Collapse toolbar';
    });

    var dtMiniPrev = document.getElementById('dt-mini-prev');
    var dtMiniNext = document.getElementById('dt-mini-next');
    var dtMiniMode = document.getElementById('dt-mini-mode');
    var dtMiniNew = document.getElementById('dt-mini-new');

    dtMiniNew.addEventListener('click', function() {
      sendInput('\x1b1');
      currentTab = 1;
      updateDesktopTabs();
      setTimeout(function() {
        sendInput('\x0c');
        setTimeout(function() { sendInput('cl\r'); }, 100);
      }, 150);
      term.focus();
    });
    dtMiniPrev.addEventListener('click', function() {
      var prev = currentTab > 1 ? currentTab - 1 : 9;
      sendInput('\x1b' + prev);
      currentTab = prev;
      updateDesktopTabs();
      term.focus();
    });
    dtMiniNext.addEventListener('click', function() {
      var next = currentTab < 9 ? currentTab + 1 : 1;
      sendInput('\x1b' + next);
      currentTab = next;
      updateDesktopTabs();
      term.focus();
    });
    dtMiniMode.addEventListener('click', function() {
      document.getElementById('dt-mouse-toggle').click();
      dtMiniMode.innerHTML = desktopMouseMode
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="8" y="2" width="8" height="16" rx="4"/><line x1="12" y1="6" x2="12" y2="10"/><line x1="12" y1="22" x2="12" y2="18"/><line x1="8" y1="22" x2="16" y2="22"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="6" y1="21" x2="18" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/><rect x="6" y="8" width="4" height="3" rx="0.5"/></svg>';
    });
  }

  // ---- Desktop toolbar ----
  var dtNewSession = document.getElementById('dt-new-session');
  if (dtNewSession) {
    dtNewSession.addEventListener('click', function() {
      sendInput('\x1b1');
      currentTab = 1;
      updateDesktopTabs();
      setTimeout(function() {
        sendInput('\x0c');
        setTimeout(function() { sendInput('cl\r'); }, 100);
      }, 150);
    });
  }

  function updateDesktopTabs() {
    document.querySelectorAll('#desktop-toolbar .dtab').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.getAttribute('data-dtab'), 10) === currentTab);
    });
  }

  document.querySelectorAll('#desktop-toolbar .dtab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var n = btn.getAttribute('data-dtab');
      var tabNum = parseInt(n, 10);
      sendInput('\x1b' + n);
      currentTab = tabNum;
      updateDesktopTabs();
    });
    btn.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      var n = btn.getAttribute('data-dtab');
      if (confirm('Kill tmux window ' + n + '?')) {
        sendInput('tmux kill-window -t :' + n + '\r');
      }
    });
  });

  updateDesktopTabs();

  // ---- Layout ----
  function updateLayout() {
    var h;
    if (window.visualViewport) {
      h = window.visualViewport.height;
      if (window.visualViewport.offsetTop > 0) {
        window.scrollTo(0, 0);
      }
    } else {
      h = window.innerHeight;
    }
    container.style.height = h + 'px';
    void container.offsetHeight;
    doFit();
  }

  var resizeTimer, lastWidth = window.innerWidth;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      var w = window.innerWidth;
      if (w !== lastWidth) {
        lastWidth = w;
        isMobile = w < 769;
        var newSize = getResponsiveFontSize();
        if (term.options.fontSize !== newSize) term.options.fontSize = newSize;
      }
      updateLayout();
    }, 50);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      updateLayout();
      // Secondary refit after keyboard animation completes
      setTimeout(updateLayout, 300);
    });
    window.visualViewport.addEventListener('scroll', function() {
      // iOS shifts the viewport when keyboard opens; reset to prevent gap
      if (window.visualViewport.offsetTop > 0) {
        window.scrollTo(0, 0);
      }
    });
  }

  // ---- Mobile single-finger scroll on terminal ----
  if (isMobile) {
    (function() {
      var termEl = document.getElementById('terminal');
      var startY = null, accum = 0, scrolling = false;

      // Detect alternate screen (tmux, vim, etc.) - scroll via mouse escape sequences
      function isAltBuffer() {
        return term.buffer && term.buffer.active && term.buffer.active.type === 'alternate';
      }

      function sendScrollUp(n) {
        for (var i = 0; i < n; i++) sendInput('\x1b[<64;1;1M');
      }
      function sendScrollDown(n) {
        for (var i = 0; i < n; i++) sendInput('\x1b[<65;1;1M');
      }

      // Use capture phase to intercept before xterm.js internal handlers
      termEl.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          startY = e.touches[0].clientY;
          accum = 0;
          scrolling = false;
        }
      }, { passive: true, capture: true });

      termEl.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1 && startY !== null) {
          e.preventDefault();
          e.stopPropagation();
          scrolling = true;
          var y = e.touches[0].clientY;
          accum += (startY - y);
          startY = y;
          var lines = Math.trunc(accum / 15);
          if (lines !== 0) {
            if (isAltBuffer()) {
              // In alternate buffer (tmux/vim): send arrow keys
              if (lines > 0) sendScrollUp(Math.abs(lines));
              else sendScrollDown(Math.abs(lines));
            } else {
              term.scrollLines(lines);
            }
            accum -= lines * 15;
          }
        }
      }, { passive: false, capture: true });

      termEl.addEventListener('touchend', function() {
        scrolling = false; startY = null; accum = 0;
      }, { capture: true });
      termEl.addEventListener('touchcancel', function() {
        scrolling = false; startY = null; accum = 0;
      }, { capture: true });
    })();

    // Prevent page-level bounce/scroll on non-terminal elements
    document.addEventListener('touchmove', function(e) {
      // Allow terminal scroll (handled above) and bubble textarea scroll
      var target = e.target;
      if (target.id === 'bubble-input') return;
      var termEl = document.getElementById('terminal');
      if (termEl && termEl.contains(target)) return;
      e.preventDefault();
    }, { passive: false });
  }

  // ---- Start ----
  updateLayout();
  connect();
})();
</script>
</body>
</html>
